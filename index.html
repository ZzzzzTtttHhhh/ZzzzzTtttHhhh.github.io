<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>测控技术与仪器资料库</title>
  <style>
    :root {
      --navy: #0b1d3d;
      --blue: #1e67dc;
      --blue-soft: #edf4ff;
      --text: #172033;
      --muted: #68758a;
      --line: #e2e8f0;
      --bg: #f6f8fb;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      color: var(--text);
      background: var(--bg);
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI",
        "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
    }

    button, input, select { font: inherit; }

    .container {
      width: min(1120px, calc(100% - 32px));
      margin: 0 auto;
    }

    header {
      background: #fff;
      border-bottom: 1px solid var(--line);
    }

    .nav {
      min-height: 66px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
      color: var(--navy);
      font-weight: 800;
    }

    .logo {
      width: 36px;
      height: 36px;
      display: grid;
      place-items: center;
      border-radius: 9px;
      color: #fff;
      background: var(--navy);
      font-size: 12px;
      letter-spacing: .06em;
    }

    .nav a {
      color: var(--muted);
      text-decoration: none;
      font-size: 14px;
      font-weight: 700;
    }

    .hero {
      padding: 48px 0 28px;
    }

    .hero-box {
      padding: clamp(28px, 6vw, 52px);
      color: #fff;
      border-radius: 22px;
      background: linear-gradient(135deg, #081832, #123a73);
    }

    h1, h2, h3, p { margin-top: 0; }

    h1 {
      margin-bottom: 12px;
      font-size: clamp(34px, 6vw, 56px);
      line-height: 1.08;
      letter-spacing: -0.04em;
    }

    .hero p {
      max-width: 680px;
      margin-bottom: 0;
      color: rgba(255,255,255,.76);
      line-height: 1.75;
    }

    main {
      padding: 8px 0 46px;
    }

    .section-head {
      margin: 30px 0 16px;
    }

    .section-head h2 {
      margin-bottom: 6px;
      color: var(--navy);
      font-size: 29px;
      letter-spacing: -0.03em;
    }

    .section-head p {
      margin-bottom: 0;
      color: var(--muted);
      line-height: 1.65;
    }

    .panel {
      padding: 18px;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 18px;
    }

    .toolbar {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 180px;
      gap: 12px;
    }

    input, select {
      width: 100%;
      min-height: 44px;
      padding: 0 13px;
      color: var(--text);
      background: #fff;
      border: 1px solid #d6deea;
      border-radius: 9px;
      outline: none;
    }

    input:focus, select:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(30,103,220,.1);
    }

    .categories {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 15px 0 18px;
    }

    .chip {
      min-height: 33px;
      padding: 0 12px;
      color: #5f6c80;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 999px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 700;
    }

    .chip.active {
      color: #fff;
      background: var(--navy);
      border-color: var(--navy);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(270px, 1fr));
      gap: 13px;
    }

    .resource-card {
      min-height: 246px;
      display: flex;
      flex-direction: column;
      padding: 18px;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 15px;
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 13px;
    }

    .file-type {
      padding: 5px 9px;
      color: var(--blue);
      background: var(--blue-soft);
      border-radius: 999px;
      font-size: 11px;
      font-weight: 900;
      text-transform: uppercase;
    }

    .file-size {
      color: #8792a3;
      font-size: 12px;
      font-weight: 700;
    }

    .resource-card h3 {
      margin-bottom: 7px;
      color: var(--navy);
      font-size: 18px;
      line-height: 1.4;
    }

    .resource-card p {
      margin-bottom: 13px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 14px;
    }

    .tag {
      padding: 5px 8px;
      color: #667286;
      background: #f3f5f8;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
    }

    .download,
    .download-list .download {
      width: 100%;
      min-height: 41px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-top: auto;
      padding: 9px 12px;
      color: #fff;
      background: var(--navy);
      border-radius: 9px;
      text-decoration: none;
      font-size: 14px;
      font-weight: 800;
    }

    .download-list {
      display: grid;
      gap: 8px;
      margin-top: auto;
    }

    .download-list .download {
      justify-content: space-between;
      margin-top: 0;
      text-align: left;
    }

    .download-name {
      min-width: 0;
      overflow-wrap: anywhere;
    }

    .download-format {
      flex: 0 0 auto;
      padding: 4px 7px;
      color: rgba(255,255,255,.82);
      background: rgba(255,255,255,.12);
      border-radius: 999px;
      font-size: 10px;
      font-weight: 900;
    }

    .empty-card {
      grid-column: 1 / -1;
      padding: 20px;
      color: var(--muted);
      border: 1px solid var(--line);
      border-radius: 13px;
    }

    footer {
      padding: 25px 0 32px;
      color: var(--muted);
      text-align: center;
      font-size: 13px;
    }

    @media (max-width: 720px) {
      .toolbar { grid-template-columns: 1fr; }
      .nav a { display: none; }
    }
  </style>
</head>
<body>
  <header>
    <div class="container nav">
      <div class="brand">
        <div class="logo">MC</div>
        <span>测控技术与仪器资料库</span>
      </div>
      <a href="#resources">资料下载</a>
    </div>
  </header>

  <section class="hero">
    <div class="container">
      <div class="hero-box">
        <h1>测控技术与仪器资料库</h1>
        <p>课程资料、实验资料与课程设计文件整理。</p>
      </div>
    </div>
  </section>

  <main id="resources">
    <div class="container">
      <div class="section-head">
        <h2>资料下载</h2>
        <p>按关键词、类型或分类查找资料。</p>
      </div>

      <div class="panel">
        <div class="toolbar">
          <input id="searchInput" type="text" placeholder="搜索资料" />
          <select id="typeSelect">
            <option value="全部">全部类型</option>
            <option value="PDF">PDF</option>
            <option value="PPT">PPT</option>
            <option value="DOC">DOC</option>
            <option value="ZIP">ZIP</option>
            <option value="资料包">资料包</option>
            <option value="代码">代码</option>
          </select>
        </div>

        <div class="categories" id="categoryBox"></div>
        <div class="grid" id="resourceGrid"></div>
      </div>
    </div>
  </main>

  <footer>© 2026 测控技术与仪器资料库</footer>

  <script>
    const resources = [
      {
        title: "电路理论实验真题",
        category: "电路理论实验",
        type: "ZIP",
        size: "431 KB",
        desc: "2024—2026 年电路实验操作题。",
        tags: ["电路理论实验"],
        link: "files/dianlulilunshiyan.zip"
      },
      {
        title: "C++ 知识点整理",
        category: "程序设计",
        type: "PDF",
        size: "3.1 MB",
        desc: "控院 C++ 常见考点整理。",
        tags: ["C++", "程序设计"],
        link: "files/C_PLUS_PLUS.pdf"
      },
      {
        title: "LGL 传感器实验",
        category: "传感器实验",
        type: "ZIP",
        size: "3.37 MB",
        desc: "LGL 传感器实验资料。",
        tags: ["传感器实验", "LGL"],
        link: "files/sensor_lab_lgl"
      },
      {
        title: "SX 传感器实验",
        category: "传感器实验",
        type: "ZIP",
        size: "1.86 MB",
        desc: "SX 传感器实验资料。",
        tags: ["传感器实验", "SX"],
        link: "files/sensor_lan_sx"
      },
      {
        title: "社会实践培训相关",
        category: "社会实践",
        type: "ZIP",
        size: "5.57 MB",
        desc: "社会实践培训资料。",
        tags: ["寒暑假社会实践"],
        link: "files/social_practise.7z"
      },
      {
        title: "高数 2-2",
        category: "高数",
        type: "ZIP",
        size: "9.78 MB",
        desc: "高数 2-2 历年资料（2006—2023）。",
        tags: ["高数 2-2"],
        link: "files/gaoshu2-2.zip"
      },
      {
        title: "大物 2-1",
        category: "大物",
        type: "ZIP",
        size: "9.05 MB",
        desc: "大物 2-1 历年资料（2006—2023）。",
        tags: ["大物 2-1"],
        link: "files/dawu2-1.zip"
      },,
      {
        title: "传感器课程设计",
        category: "传感器课程设计",
        type: "资料包",
        size: "5 个文件",
        desc: "MPU6050、蓝牙通信、平衡控制与 PT100 测温相关工程文件。",
        tags: ["传感器", "MPU6050", "PT100", "Multisim"],
        files: [
          {
            name: "BlueTooth.7z",
            type: "7Z",
            link: "files/BlueTooth.7z"
          },
          {
            name: "MiniBalance.zip",
            type: "ZIP",
            link: "files/MiniBalance.zip"
          },
          {
            name: "ProPrj_MPU6050_2026-07-19.epro2",
            type: "EPRO2",
            link: "files/ProPrj_MPU6050_2026-07-19.epro2"
          },
          {
            name: "ProPrj_传感器课程设计_PT100测温电路.epro2",
            type: "EPRO2",
            link: "files/ProPrj_传感器课程设计_PT100测温电路.epro2"
          },
          {
            name: "设计1.ms14",
            type: "MS14",
            link: "files/设计1.ms14"
          }
        ]
      }

    ];

    let currentCategory = "全部";
    const categories = ["全部", ...new Set(resources.map(item => item.category))];
    const categoryBox = document.getElementById("categoryBox");
    const resourceGrid = document.getElementById("resourceGrid");
    const searchInput = document.getElementById("searchInput");
    const typeSelect = document.getElementById("typeSelect");

    function renderCategories() {
      categoryBox.innerHTML = categories.map(category => `
        <button class="chip ${category === currentCategory ? "active" : ""}"
          type="button" data-category="${category}">
          ${category}
        </button>
      `).join("");
    }

    function renderResources() {
      const keyword = searchInput.value.trim().toLowerCase();
      const type = typeSelect.value;

      const filtered = resources.filter(item => {
        const matchCategory = currentCategory === "全部" || item.category === currentCategory;
        const matchType = type === "全部" || item.type.toUpperCase() === type.toUpperCase();
        const fileText = item.files ? item.files.map(file => file.name).join(" ") : "";
        const text = `${item.title} ${item.category} ${item.desc} ${item.tags.join(" ")} ${fileText}`.toLowerCase();
        return matchCategory && matchType && text.includes(keyword);
      });

      if (!filtered.length) {
        resourceGrid.innerHTML = `<div class="empty-card">没有找到相关资料。</div>`;
        return;
      }

      resourceGrid.innerHTML = filtered.map(item => `
        <article class="resource-card">
          <div class="card-top">
            <span class="file-type">${item.type}</span>
            <span class="file-size">${item.size}</span>
          </div>

          <h3>${item.title}</h3>
          <p>${item.desc}</p>

          <div class="tags">
            ${item.tags.map(tag => `<span class="tag">#${tag}</span>`).join("")}
          </div>

          ${item.files && item.files.length ? `
            <div class="download-list">
              ${item.files.map(file => `
                <a class="download" href="${file.link}" download>
                  <span class="download-name">${file.name}</span>
                  <span class="download-format">${file.type}</span>
                </a>
              `).join("")}
            </div>
          ` : `
            <a class="download" href="${item.link}" download>下载资料</a>
          `}
        </article>
      `).join("");
    }

    categoryBox.addEventListener("click", event => {
      const button = event.target.closest("button[data-category]");
      if (!button) return;
      currentCategory = button.dataset.category;
      renderCategories();
      renderResources();
    });

    searchInput.addEventListener("input", renderResources);
    typeSelect.addEventListener("change", renderResources);

    renderCategories();
    renderResources();
  </script>

</body>
</html>
